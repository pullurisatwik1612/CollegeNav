{% extends "base.html" %}
{% block content %}
{% include "_admin_nav.html" %}
<h1 class="text-xl font-bold mb-2">Stops</h1>
<form method="post" class="bg-white rounded-xl border p-4 space-y-2 mb-4">
  <input type="hidden" name="act" value="add">
  <div class="font-semibold">Add a stop</div>
  <div class="grid grid-cols-2 gap-2">
    <input name="name" required placeholder="Stop name" class="border rounded-lg px-3 py-2 col-span-2">
    <input name="landmark" placeholder="Landmark (optional)" class="border rounded-lg px-3 py-2 col-span-2">
    <input id="lat" name="lat" required placeholder="Latitude" class="border rounded-lg px-3 py-2">
    <input id="lng" name="lng" required placeholder="Longitude" class="border rounded-lg px-3 py-2">
  </div>
  <div id="pick" class="h-56 rounded-lg border bg-slate-200"></div>
  <p class="text-xs text-slate-500">Tap the map to fill latitude and longitude.</p>
  <button class="bg-slate-900 text-white rounded-lg px-4 py-2 text-sm">Add stop</button>
</form>
<div class="space-y-2">
{% for s in stops %}
  <form method="post" class="bg-white rounded-xl border p-3 grid grid-cols-2 gap-2 text-sm">
    <input type="hidden" name="id" value="{{ s['id'] }}">
    <input name="name" value="{{ s['name'] }}" class="border rounded px-2 py-1.5 col-span-2" required>
    <input name="landmark" value="{{ s['landmark'] or '' }}" placeholder="Landmark" class="border rounded px-2 py-1.5 col-span-2">
    <input name="lat" value="{{ s['lat'] }}" class="border rounded px-2 py-1.5" required>
    <input name="lng" value="{{ s['lng'] }}" class="border rounded px-2 py-1.5" required>
    <div class="col-span-2 flex gap-2"><button name="act" value="save" class="bg-slate-900 text-white rounded px-3 py-1">Save</button>
      <button name="act" value="delete" onclick="return confirm('Delete this stop?')" class="text-red-600 border border-red-300 rounded px-3 py-1">Delete</button></div>
  </form>
{% endfor %}
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const m = L.map('pick').setView([17.33, 78.6], 10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '&copy; OpenStreetMap'}).addTo(m);
let pin = null;
m.on('click', e => { $('lat').value = e.latlng.lat.toFixed(6); $('lng').value = e.latlng.lng.toFixed(6); if (pin) pin.setLatLng(e.latlng); else pin = L.marker(e.latlng).addTo(m); });
</script>
{% endblock %}
