{% macro fresh_badge(f) %}
<span class="inline-flex items-center gap-1.5 text-[11px] px-2.5 py-0.5 rounded-full font-bold transition-all {% if f.level=='ok' %}bg-[#34D399]/15 text-[#34D399] border border-[#34D399]/30{% elif f.level=='warn' %}bg-[#FBBF24]/15 text-[#FBBF24] border border-[#FBBF24]/30{% else %}bg-[#E5384B]/15 text-[#FF8A8A] border border-[#E5384B]/30{% endif %}">
  {% if f.level=='ok' %}
    <span class="w-1.5 h-1.5 rounded-full bg-[#34D399]"></span>
  {% elif f.level=='warn' %}
    <span class="w-1.5 h-1.5 rounded-full bg-[#FBBF24]"></span>
  {% else %}
    <span class="w-1.5 h-1.5 rounded-full bg-[#E5384B]"></span>
  {% endif %}
  {{ f.text }}
</span>
{% endmacro %}

{% macro alert_box(a) %}
<div class="card p-4 rounded-2xl border-l-4 space-y-1.5 transition-all {% if a.kind=='cancelled' %}border-l-[#E5384B] bg-gradient-to-r from-[#541A2E]/30 to-[#242F49]{% elif a.kind=='delay' %}border-l-[#FBBF24]{% elif a.kind=='diversion' %}border-l-[#FFA586]{% else %}border-l-[#34D399]{% endif %}">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-[10px] font-extrabold uppercase tracking-wider {% if a.kind=='cancelled' %}text-[#FF8A8A]{% elif a.kind=='delay' %}text-[#FBBF24]{% elif a.kind=='diversion' %}text-[#FFA586]{% else %}text-[#34D399]{% endif %}">
        {{ a.kind|upper }}
      </span>
      {% if a.route_code %}
      <span class="px-2 py-0.5 rounded bg-[#161E2F] border border-[#384358] text-[10px] font-mono text-[#FFA586] font-bold">
        {{ a.route_code }}
      </span>
      {% endif %}
    </div>
    <span class="text-[11px] text-[#AEB5C6] font-mono">{{ a.age }}</span>
  </div>
  <p class="text-xs font-semibold text-[#F4EFEC] leading-relaxed">
    {{ a.message }}
  </p>
</div>
{% endmacro %}
