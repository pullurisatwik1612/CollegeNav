{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-bold mb-2">Live bus map</h1>
<div id="map" class="h-[60vh] rounded-xl overflow-hidden border bg-slate-200"></div>
<div class="mt-2 flex flex-wrap gap-2 text-xs">{% for r in routes %}<span class="bg-white border rounded-full px-2 py-1"><span class="dot" style="background:{{ r.color }}"></span> {{ r.code }}</span>{% endfor %}</div>
<div id="status" class="mt-2 text-xs text-slate-500">Loading...</div>
{% endblock %}
{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const ROUTES = {{ routes|tojson }};
const map = L.map('map').setView([17.33, 78.6], 10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '&copy; OpenStreetMap'}).addTo(map);
const all = [];
ROUTES.forEach(r => { if (r.stops.length) { const pts = r.stops.map(s => [s.lat, s.lng]); all.push(...pts);
  L.polyline(pts, {color: r.color, weight: 4, opacity: .7}).addTo(map).bindTooltip(r.code + ' ' + r.name);
  r.stops.forEach(s => L.circleMarker([s.lat, s.lng], {radius: 4, color: r.color, fillColor: '#fff', fillOpacity: 1, weight: 2}).addTo(map).bindTooltip(s.name)); } });
if (all.length) map.fitBounds(all, {padding: [20, 20]});
const markers = {};
async function refresh(){
  try {
    const d = await (await fetch('/api/live')).json(); let n = 0, sim = 0;
    ROUTES.forEach(r => { const v = d[r.id];
      if (v && v.available) { n++; if (v.source === 'sim') sim++; const ll = [v.lat, v.lng];
        if (!markers[r.id]) { markers[r.id] = L.marker(ll, {icon: L.divIcon({html: '🚌', className: 'bus-icon', iconSize: [30, 30]})}).addTo(map); }
        markers[r.id].setLatLng(ll).bindTooltip(`${r.code} · ${v.bus} · ${v.label}`);
      } else if (markers[r.id]) { map.removeLayer(markers[r.id]); delete markers[r.id]; } });
    $('status').textContent = n ? `${n} bus${n > 1 ? 'es' : ''} on the map` + (sim ? ` (${sim} simulated for demo)` : ' (live GPS)') : 'No live buses right now. Check scheduled times under Routes.';
  } catch (e) { $('status').textContent = 'Could not load live data.'; }
}
refresh(); setInterval(refresh, 6000);
</script>
{% endblock %}
